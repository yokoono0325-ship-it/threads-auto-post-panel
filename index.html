<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Threads自動投稿</title>
<style>
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #f0f0f3;
  --text: #1c1c1e;
  --muted: #6b6b72;
  --line: #e2e2e6;
  --accent: #2f5bea;
  --accent-text: #ffffff;
  --accent-soft: #e8eeff;
  --danger: #c62828;
  --danger-soft: #fdecec;
  --warn: #8a5a00;
  --warn-soft: #fff4d6;
  --ok: #1b7f3b;
  --ok-soft: #e5f5ea;
  --radius: 14px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111113;
    --surface: #1c1c1f;
    --surface-2: #26262a;
    --text: #f2f2f4;
    --muted: #a0a0a8;
    --line: #34343a;
    --accent: #7c9bff;
    --accent-text: #0d1330;
    --accent-soft: #232c4d;
    --danger: #ff7b7b;
    --danger-soft: #3a1d1f;
    --warn: #f3c45a;
    --warn-soft: #3a2f14;
    --ok: #6fd391;
    --ok-soft: #173322;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}
[hidden] { display: none !important; }
a { color: var(--accent); }
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom));
}
header.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding: 12px 16px 8px;
  max-width: 640px; margin: 0 auto;
}
header.top h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }

.banner {
  border-radius: var(--radius); padding: 12px 14px; margin: 8px 0 12px;
  font-size: 14px; line-height: 1.5;
}
.banner p { margin: 0; }
.banner p + p { margin-top: 6px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.danger { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.banner .btn { margin-top: 10px; }

h2 { font-size: 15px; margin: 22px 0 8px; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
h2 .count-pill { margin-left: 6px; }
.lead { font-size: 14px; color: var(--muted); margin: -2px 0 10px; }
.section {
  background: var(--surface); border-radius: var(--radius); padding: 16px;
  margin-bottom: 12px; border: 1px solid var(--line);
}
.muted { color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); font-size: 14px; padding: 14px; text-align: center; background: var(--surface); border-radius: var(--radius); border: 1px dashed var(--line); }

.post-card, .history-card, .unposted-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; margin-bottom: 10px; overflow-wrap: anywhere;
}
.post-card.is-busy { opacity: .65; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.when { font-weight: 700; font-size: 15px; margin-right: auto; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.pending { background: var(--warn-soft); color: var(--warn); }
.badge.approved, .badge.ready, .badge.good { background: var(--ok-soft); color: var(--ok); }
.badge.busy { background: var(--accent-soft); color: var(--accent); }
.badge.bad { background: var(--danger-soft); color: var(--danger); }
.count-pill { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
.part { white-space: pre-wrap; font-size: 15px; }
.part + .part { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }
.part-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.meta { font-size: 13px; color: var(--muted); margin-top: 8px; }
.error-text { font-size: 13px; color: var(--danger); margin-top: 6px; }

details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
details > summary .card-head::after { content: "▾"; color: var(--muted); font-size: 12px; transition: transform .15s; }
details[open] > summary .card-head::after { transform: rotate(180deg); }
.preview { font-size: 15px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.preview.one { -webkit-line-clamp: 1; }
.detail-body { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.summary-link { display: inline-flex; align-items: center; min-height: 40px; margin-top: 6px; font-size: 14px; font-weight: 600; }

.runs-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 14px; margin-top: 22px; }
.runs-box > summary { padding: 14px 0; font-weight: 600; display: flex; justify-content: space-between; }
.runs-box > summary::after { content: "▾"; color: var(--muted); }
.runs-box[open] > summary::after { content: "▴"; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.actions button { flex: 1 1 0; min-width: 88px; }
button.btn, .btn {
  min-height: 46px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
}
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.reload-row { margin-top: 18px; }

.edit-area { display: grid; gap: 10px; }
.edit-row { display: grid; gap: 4px; }
.edit-row-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.edit-row-head .over { color: var(--danger); font-weight: 700; }

label.field { display: block; margin-bottom: 14px; }
label.field > span, .field-title { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
input[type=text], input[type=password], input[type=number], textarea, select {
  width: 100%; font-size: 16px; font-family: inherit; color: var(--text);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px; min-height: 46px;
}
textarea { resize: vertical; line-height: 1.6; }
.times { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 14px; }
.times label { font-size: 12px; color: var(--muted); }
.form-errors { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.form-errors ul { margin: 0; padding-left: 18px; }

.mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mode-row button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.two-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

.neta-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; font-size: 15px; overflow-wrap: anywhere; }
.neta-item .date { font-size: 12px; color: var(--muted); display: block; }
.neta-row { display: flex; align-items: center; gap: 8px; }
.neta-row .neta-text { flex: 1; min-width: 0; }
.neta-del { flex: none; min-height: 36px; padding: 4px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--danger); font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
.neta-del:disabled { opacity: .45; cursor: not-allowed; }

.run { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.run .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run .time { color: var(--muted); font-size: 12px; white-space: nowrap; }

.status-line { font-size: 14px; margin-top: 8px; }
.status-line.bad { color: var(--danger); }
.status-line.good { color: var(--ok); }
.token-status { font-size: 15px; white-space: pre-line; margin-bottom: 10px; }
.row-gap { display: grid; gap: 10px; }

nav.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabbar .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabbar button {
  height: var(--tabbar-h); border: none; background: none; color: var(--muted);
  font-size: 13px; font-family: inherit; cursor: pointer;
}
nav.tabbar button[aria-selected="true"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 3px 0 var(--accent); }

#toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom));
  max-width: 560px; margin: 0 auto; z-index: 20;
  background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 14px;
  box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
#toast.error { background: var(--danger); color: #fff; }

.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 18px; padding: 20px; width: 100%; max-width: 480px; margin-bottom: env(safe-area-inset-bottom); }
.modal p { margin: 0 0 16px; white-space: pre-line; }
.modal .actions { margin-top: 0; }
</style>
</head>
<body>

<header class="top">
  <h1>Threads自動投稿</h1>
</header>

<div class="wrap">
  <div id="token-banner" class="banner" role="status" hidden></div>

  <!-- ホーム -->
  <section id="view-home">
    <div id="paused-banner" class="banner danger" role="status" hidden>
      <p>緊急停止中です。下書きづくりも投稿も止まっています。</p>
      <button class="btn primary block" type="button" data-action="resume">再開する</button>
    </div>

    <h2>投稿のしかた</h2>
    <div class="mode-row" role="group" aria-label="投稿のしかた">
      <button class="btn" id="mode-approval" type="button" aria-pressed="true">承認してから投稿</button>
      <button class="btn" id="mode-auto" type="button" aria-pressed="false">完全自動</button>
    </div>
    <div class="two-buttons">
      <button class="btn" id="plan-now" type="button">今すぐ下書き</button>
      <button class="btn danger" id="pause-btn" type="button">緊急停止</button>
    </div>

    <h2>承認待ち <span class="count-pill" id="pending-count">0</span></h2>
    <div id="pending-list"></div>
    <h2>予約済み <span class="count-pill" id="scheduled-count">0</span></h2>
    <div id="scheduled-list"></div>

    <div class="reload-row"><button class="btn block" type="button" data-action="reload">最新の内容を読み直す</button></div>
  </section>

  <!-- ネタ帳 -->
  <section id="view-neta" hidden>
    <h2>ネタ帳</h2>
    <p class="lead">投稿したいことを一言で。翌朝、これをもとに AI が下書きを作ります。</p>
    <div class="section">
      <textarea id="neta-input" rows="4" aria-label="ネタ"></textarea>
      <div class="actions"><button class="btn primary" id="neta-submit" type="button">ネタ帳に追加</button></div>
    </div>
    <h2>これから使うネタ</h2>
    <p class="lead">上から順に使います</p>
    <div id="neta-pending-list"></div>
    <h2>使用済み</h2>
    <div id="neta-used-list"></div>
  </section>

  <!-- 履歴 -->
  <section id="view-history" hidden>
    <h2>投稿履歴</h2>
    <div id="history-list"></div>
    <h2>投稿しなかったもの</h2>
    <div id="unposted-list"></div>
    <details id="runs-box" class="runs-box">
      <summary>最近の自動実行</summary>
      <div id="runs-list"></div>
    </details>
    <div class="reload-row"><button class="btn block" type="button" data-action="reload">最新の内容を読み直す</button></div>
  </section>

  <!-- 設定 -->
  <section id="view-settings" hidden>
    <h2>GitHub との接続</h2>
    <div class="section">
      <label class="field"><span>GitHub のユーザー名</span>
        <input type="text" id="conn-owner" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field"><span>リポジトリ名</span>
        <input type="text" id="conn-repo" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field"><span>アクセストークン</span>
        <input type="password" id="conn-token" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <div class="actions">
        <button class="btn primary" id="conn-save" type="button">接続</button>
        <button class="btn ghost" id="conn-clear" type="button">接続を解除</button>
      </div>
      <div id="conn-status" class="status-line"></div>
    </div>

    <h2>発信の設定</h2>
    <div class="section">
      <label class="field"><span>Threads のアカウント名</span>
        <input type="text" id="set-handle" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field"><span>あなたの立場</span>
        <input type="text" id="set-persona">
      </label>
      <label class="field"><span>届けたい相手</span>
        <input type="text" id="set-audience">
      </label>
      <label class="field"><span>発信テーマ（1行に1つ）</span>
        <textarea id="set-themes" rows="4"></textarea>
      </label>
    </div>

    <h2>投稿の数と時間</h2>
    <div class="section">
      <label class="field"><span>1日の投稿の数</span>
        <select id="set-posts-per-day"></select>
      </label>
      <span class="field-title">投稿の時間</span>
      <div class="times" id="times-box"></div>
      <label class="field"><span>1日の投稿の上限</span>
        <input type="number" id="set-max-per-day" inputmode="numeric" min="1" max="50">
      </label>
    </div>
    <div id="settings-errors" class="form-errors" hidden></div>
    <button class="btn primary block" id="settings-save" type="button">設定を保存</button>

    <h2>Threads のトークン</h2>
    <div class="section">
      <div id="token-status" class="token-status">—</div>
      <div class="row-gap">
        <button class="btn primary block" id="token-refresh" type="button">トークンを更新</button>
        <div id="token-refresh-note" class="muted"></div>
        <button class="btn block" id="token-setup" type="button">初回セットアップ</button>
      </div>
    </div>
  </section>
</div>

<nav class="tabbar" aria-label="タブ">
  <div class="inner" role="tablist">
    <button id="tab-btn-home" type="button" role="tab" aria-selected="true">ホーム</button>
    <button id="tab-btn-neta" type="button" role="tab" aria-selected="false">ネタ帳</button>
    <button id="tab-btn-history" type="button" role="tab" aria-selected="false">履歴</button>
    <button id="tab-btn-settings" type="button" role="tab" aria-selected="false">設定</button>
  </div>
</nav>

<div id="toast" role="status" aria-live="polite" hidden></div>

<div class="modal-back" id="confirm-back" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
    <p id="confirm-text"></p>
    <div class="actions">
      <button class="btn" id="confirm-no" type="button">やめる</button>
      <button class="btn primary" id="confirm-yes" type="button">はい</button>
    </div>
  </div>
</div>

<script>
"use strict";

// ===== 決まりごと（CLAUDE.md） =====
const API = "https://api.github.com";
const LS_CONN = "tpost-panel-conn";
const LS_TAB = "tpost-panel-tab";
const DAY = 86400000;
const DEFAULT_TIMES = ["07:00", "12:00", "19:00", "09:00", "21:00", "08:00", "15:00", "17:00", "10:00", "20:00"];
const DEFAULTS = {
  handle: "", persona: "", audience: "", themes: [], mode: "approval", paused: false,
  posts_per_day: 1, post_times: ["07:00"], max_posts_per_day: 10, max_length: 500,
  thread_max_parts: 5, similarity_threshold: 0.6, ai_model: "claude-sonnet-5-5"
};
const ACTIVE = ["pending", "approved", "ready"];
const CARD_STATUS = { pending: "承認待ち", approved: "承認ずみ", ready: "完全自動" };
const UNPOSTED = {
  failed: { label: "失敗", reason: null },
  expired: { label: "期限切れ", reason: "予定の時刻から3時間たっても投稿できませんでした" },
  skipped: { label: "見送り", reason: "過去の投稿と似ていたため、投稿しませんでした" }
};
const RUN_NAMES = {
  "plan.yml": "1. 下書きを作る（毎朝）", "post.yml": "2. 投稿する", "control.yml": "3. 操作", "token.yml": "4. トークン"
};
const TABS = ["home", "neta", "history", "settings"];
const NOT_CONNECTED = "まだ GitHub と接続していません。「設定」の「GitHub との接続」から接続してください";

const state = {
  conn: null, repoInfo: null, settings: null, queue: [], history: [],
  neta: { unused: [], used: [] }, token: null, tokenLoaded: false, runs: [],
  loading: false, pendingIds: new Set(), editing: new Map(), formDirty: false
};

const $ = (id) => document.getElementById(id);

function h(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "disabled" || k === "value" || k === "rows") e[k] = v;
      else e.setAttribute(k, v === true ? "" : String(v));
    }
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}

// ===== 文字数・URL・本文の確認（設計書「7.」「11.」） =====
const EMOJI_RANGES = [[0x200D, 0x200D], [0x20E3, 0x20E3], [0x2190, 0x21FF], [0x2300, 0x23FF], [0x2460, 0x24FF],
  [0x25A0, 0x25FF], [0x2600, 0x27BF], [0x2900, 0x297F], [0x2B00, 0x2BFF], [0x3030, 0x3030], [0x303D, 0x303D],
  [0x3297, 0x3299], [0xFE00, 0xFE0F], [0x10000, 0x10FFFF]];
const URL_RE = /https?:\/\/[^\s<>"'）」】、。]+/;

function isEmoji(cp) { return EMOJI_RANGES.some(([lo, hi]) => cp >= lo && cp <= hi); }
function utf8Len(cp) { return cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4; }
function countChars(text) {
  let n = 0;
  for (const ch of String(text).normalize("NFC")) {
    const cp = ch.codePointAt(0);
    n += isEmoji(cp) ? utf8Len(cp) : 1;
  }
  return n;
}
function hasUrl(text) { return URL_RE.test(text); }
function splitParts(text) {
  const parts = [];
  let cur = [];
  for (const line of String(text).split(/\r?\n/)) {
    if (line.trim() === "---") { parts.push(cur.join("\n")); cur = []; }
    else cur.push(line);
  }
  parts.push(cur.join("\n"));
  return parts.map((p) => p.trim()).filter((p) => p);
}
function checkParts(parts, s) {
  if (!parts.length) return ["本文が空です"];
  const errors = [];
  if (parts.length > s.thread_max_parts) errors.push(`スレッドの数が${s.thread_max_parts}を超えています（${parts.length}）`);
  parts.forEach((p, i) => {
    const n = countChars(p);
    if (n > s.max_length) errors.push(`${i + 1}つ目が長すぎます（${n}／${s.max_length}）`);
    if (hasUrl(p)) errors.push(`${i + 1}つ目にURLが入っています（URLは投稿できません）`);
  });
  return errors;
}

// ===== 設定（設計書「3.」） =====
function toMinutes(t) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(t);
  return m ? Number(m[1]) * 60 + Number(m[2]) : NaN;
}
function byTime(a, b) { return toMinutes(a) - toMinutes(b); }
// 先頭から count 個を使い、足りない分を既定の並びから補う（すでにある時刻は飛ばす）
function fillTimes(times, count) {
  const result = times.filter((t) => typeof t === "string").slice(0, count);
  for (const t of DEFAULT_TIMES) {
    if (result.length >= count) break;
    if (!result.includes(t)) result.push(t);
  }
  return result;
}
function normSettings(raw) {
  const s = Object.assign({}, DEFAULTS, raw && typeof raw === "object" ? raw : {});
  s.handle = String(s.handle || "").trim().replace(/^@+/, "");
  s.themes = Array.isArray(s.themes) ? s.themes.map((t) => String(t).trim()).filter((t) => t) : [];
  let n = parseInt(s.posts_per_day, 10);
  if (isNaN(n)) n = 1;
  s.posts_per_day = Math.min(10, Math.max(1, n));
  s.saved_times = Array.isArray(s.post_times) ? s.post_times.filter((t) => typeof t === "string") : [];
  s.post_times = fillTimes(s.saved_times, s.posts_per_day).sort(byTime);
  for (const k of ["max_posts_per_day", "max_length", "thread_max_parts"]) {
    const v = parseInt(s[k], 10);
    s[k] = isNaN(v) ? DEFAULTS[k] : v;
  }
  return s;
}

// ===== ネタ帳（設計書「5.」） =====
function parseNeta(text) {
  const result = { unused: [], used: [] };
  let section = null;
  for (const line of String(text).split(/\r?\n/)) {
    if (line.startsWith("## ")) {
      const name = line.slice(3).trim();
      section = name === "未使用" ? "unused" : name === "使用済み" ? "used" : null;
    } else if (section && line.startsWith("- ") && line.slice(2).trim()) {
      result[section].push(line.slice(2).trim());
    }
  }
  return result;
}

// ===== 日時（日本時間） =====
const JST_FMT = new Intl.DateTimeFormat("ja-JP", {
  timeZone: "Asia/Tokyo", year: "numeric", month: "numeric", day: "numeric",
  hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23"
});
function jstParts(d) { const p = {}; for (const x of JST_FMT.formatToParts(d)) p[x.type] = x.value; return p; }
function toDate(s) { if (!s) return null; const d = new Date(s); return isNaN(d.getTime()) ? null : d; }
function fmtDateTime(d) { if (!d) return "—"; const p = jstParts(d); return `${p.month}/${p.day}(${p.weekday}) ${p.hour}:${p.minute}`; }
function fmtYMD(d) { const p = jstParts(d); return `${p.year}/${p.month}/${p.day}`; }
function fmtFull(d) { const p = jstParts(d); return `${p.year}/${p.month}/${p.day} ${p.hour}:${p.minute}`; }
function daysLeft(when, now) { return Math.floor((when.getTime() - now.getTime()) / DAY); }

}

// ===== GitHub API =====
class ApiError extends Error {
  constructor(status, message) { super(message); this.status = status; }
}
function errorMessage(status) {
  switch (status) {
    case 0: return "GitHub につながりません（通信を確かめてください）";
    case 401: return "アクセストークンが無効か、期限切れです";
    case 403: return "権限が足りません（トークンの Contents と Actions を Read and write に）";
    case 404: return "見つかりません（404）。ユーザー名・リポジトリ名と、トークンの対象リポジトリを確かめてください";
    case 409: return "ほかの更新と重なりました（409）。もう一度試してください";
    case 422: return "GitHub に断られました（422）。ワークフローのファイルを確かめてください";
    default: return `GitHub API エラー（${status}）`;
  }
}
function apiUrl(path) {
  let url = API + path;
  while (url.endsWith("/")) url = url.slice(0, -1);
  return url;
}
async function gh(method, path, body, conn) {
  conn = conn || state.conn;
  const headers = {
    "Authorization": `Bearer ${conn.token}`,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  let res;
  try {
    res = await fetch(apiUrl(path), { method, headers, cache: "no-store", body: body === undefined ? undefined : JSON.stringify(body) });
  } catch (e) {
    throw new ApiError(0, errorMessage(0));
  }
  if (!res.ok) throw new ApiError(res.status, errorMessage(res.status));
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
function repoPath(conn) {
  conn = conn || state.conn;
  return `/repos/${encodeURIComponent(conn.owner)}/${encodeURIComponent(conn.repo)}`;
}
function contentsPath(path, conn) {
  return `${repoPath(conn)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
}
function b64decode(b64) {
  const bin = atob(String(b64).replace(/\s/g, ""));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}
function b64encode(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function readFile(path, conn) {
  const d = await gh("GET", contentsPath(path, conn), undefined, conn);
  return { text: b64decode(d.content || ""), sha: d.sha };
}
async function readJson(path, fallback) {
  try {
    const f = await readFile(path);
    return f.text.trim() ? JSON.parse(f.text) : fallback;
  } catch (e) {
    if (e.status === 404) return fallback;
    if (e instanceof SyntaxError) return fallback;
    throw e;
  }
}
async function defaultBranch() {
  if (!state.repoInfo) state.repoInfo = await gh("GET", repoPath());
  return state.repoInfo.default_branch;
}

// ワークフローを動かす
let reloadTimers = [];
function scheduleReload() {
  reloadTimers.forEach(clearTimeout);
  reloadTimers = [20000, 60000].map((ms) => setTimeout(() => loadAll(), ms));
}
async function dispatch(workflow, inputs) {
  const ref = await defaultBranch();
  const body = inputs ? { ref, inputs } : { ref };
  await gh("POST", `${repoPath()}/actions/workflows/${workflow}/dispatches`, body);
  scheduleReload();
}
function runControl(action, id, text) {
  // control.yml に送る入力は action・id・text だけ
  return dispatch("control.yml", { action, id: id || "", text: text || "" });
}

// settings.json を書きかえる（409 のときは読み直して1回だけ当て直す）
async function updateSettings(mutate) {
  const attempt = async () => {
    const f = await readFile("settings.json");
    let obj;
    try { obj = JSON.parse(f.text); } catch (e) { obj = {}; }
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) obj = {};
    mutate(obj);
    const branch = await defaultBranch();
    await gh("PUT", contentsPath("settings.json"), {
      message: "操作画面から設定を変更",
      content: b64encode(JSON.stringify(obj, null, 2) + "\n"),
      sha: f.sha,
      branch
    });
    return obj;
  };
  let obj;
  try {
    obj = await attempt();
  } catch (e) {
    if (e.status !== 409) throw e;
    obj = await attempt();
  }
  state.settings = normSettings(obj);
  renderAll();
}

// ===== 読み込み =====
async function loadAll() {
  if (!state.conn || state.loading) return;
  state.loading = true;
  document.querySelectorAll('[data-action="reload"]').forEach((b) => { b.disabled = true; });
  try {
    await defaultBranch();
    const [settingsFile, queue, history, netaText, token, runs] = await Promise.all([
      readFile("settings.json"),
      readJson("data/queue.json", []),
      readJson("data/history.json", []),
      readFile("neta.md").then((f) => f.text).catch((e) => { if (e.status === 404) return ""; throw e; }),
      readJson("data/token.json", null),
      gh("GET", `${repoPath()}/actions/runs?per_page=8`).catch(() => null)
    ]);
    let raw = {};
    try { raw = JSON.parse(settingsFile.text); } catch (e) { raw = {}; }
    state.settings = normSettings(raw);
    state.queue = Array.isArray(queue) ? queue : [];
    state.history = Array.isArray(history) ? history : [];
    state.neta = parseNeta(netaText);
    state.token = token && typeof token === "object" ? token : null;
    state.tokenLoaded = true;
    state.runs = runs && Array.isArray(runs.workflow_runs) ? runs.workflow_runs : [];
    // 最新の内容を表示したら「反映待ち」は元に戻す
    state.pendingIds.clear();
    for (const id of [...state.editing.keys()]) {
      const item = state.queue.find((q) => q.id === id);
      if (!item || !ACTIVE.includes(item.status)) state.editing.delete(id);
    }
    setConnStatus("", "");
    renderAll();
  } catch (e) {
    setConnStatus(e.message, "bad");
    toast(e.message, true);
  } finally {
    state.loading = false;
    document.querySelectorAll('[data-action="reload"]').forEach((b) => { b.disabled = false; });
  }
}

}

function postCard(item, kind) {
  const id = item.id;
  const busy = state.pendingIds.has(id);
  const editing = state.editing.get(id);
  const sourceText = item.source === "neta" ? "ネタ帳から" : `テーマ：${item.theme || ""}`;
  const card = h("article", { class: "post-card" + (busy ? " is-busy" : ""), "data-id": id },
    h("div", { class: "card-head" },
      h("span", { class: "when", text: fmtDateTime(toDate(item.scheduled_at)) }),
      h("span", { class: `badge ${item.status}`, text: CARD_STATUS[item.status] || item.status }),
      h("span", { class: "badge", text: sourceText }),
      busy ? h("span", { class: "badge busy", text: "反映中…" }) : null));

  if (editing) {
    const area = h("div", { class: "edit-area" });
    editing.forEach((text, i) => {
      const ta = h("textarea", { class: "edit-part", "data-index": i, rows: 6, "aria-label": `${i + 1}つ目の本文` });
      ta.value = text;
      area.append(h("div", { class: "edit-row" },
        h("div", { class: "edit-row-head" },
          h("span", { text: editing.length > 1 ? `${i + 1}/${editing.length}` : "本文" }),
          h("span", { class: "char-count", "data-index": i })),
        ta));
    });
    area.append(h("div", { class: "error-text edit-errors" }));
    card.append(area, h("div", { class: "actions" },
      h("button", { class: "btn", type: "button", "data-action": "add-part", text: "続きを足す" }),
      h("button", { class: "btn primary", type: "button", "data-action": "save-edit", text: "修正して承認" }),
      h("button", { class: "btn ghost", type: "button", "data-action": "cancel-edit", text: "やめる" })));
    updateEditValidity(card);
    return card;
  }

  card.append(...partsView(item.parts));
  if (item.source === "neta" && item.neta) card.append(h("div", { class: "meta", text: `ネタ：${item.neta}` }));
  const buttons = kind === "pending"
    ? [h("button", { class: "btn primary", type: "button", "data-action": "approve", disabled: busy, text: "承認" }),
       h("button", { class: "btn", type: "button", "data-action": "edit", disabled: busy, text: "修正" }),
       h("button", { class: "btn danger", type: "button", "data-action": "reject", disabled: busy, text: "却下" })]
    : [h("button", { class: "btn", type: "button", "data-action": "edit", disabled: busy, text: "修正" }),
       h("button", { class: "btn danger", type: "button", "data-action": "cancel", disabled: busy, text: "取り消し" })];
  card.append(h("div", { class: "actions" }, buttons));
  return card;
}

function updateEditValidity(card) {
  const id = card.getAttribute("data-id");
  const editing = state.editing.get(id);
  if (!editing || !state.settings) return;
  const s = state.settings;
  card.querySelectorAll(".char-count").forEach((el) => {
    const n = countChars((editing[Number(el.getAttribute("data-index"))] || "").trim());
    el.textContent = `${n}／${s.max_length}文字`;
    el.className = "char-count" + (n > s.max_length ? " over" : "");
  });
  const errors = checkParts(splitParts(editing.join("\n---\n")), s);
  const box = card.querySelector(".edit-errors");
  if (box) box.textContent = errors.join("／");
  const save = card.querySelector('[data-action="save-edit"]');
  if (save) save.disabled = errors.length > 0;
}

// トークンの知らせ（当てはまるものをすべて並べる）
function tokenAlerts(rec, now) {
  const alerts = [];
  if (!rec) {
    alerts.push({ red: false, text: "Threadsのトークンの初回セットアップがまだです（「設定」→「初回セットアップ」）" });
    return alerts;
  }
  const exp = toDate(rec.expires_at);
  const expired = !!exp && exp.getTime() <= now.getTime();
  if (exp) {
    const n = daysLeft(exp, now);
    if (expired) alerts.push({ red: true, text: "Threadsのトークンの期限が切れています。投稿できません（取り直しが必要です）" });
    else if (n <= 3) alerts.push({ red: true, text: `Threadsのトークンの期限まで、あと${n}日です。今すぐ「設定」→「トークンを更新」を押してください` });
    else if (n <= 14) alerts.push({ red: false, text: `Threadsのトークンの期限まで、あと${n}日です（「設定」→「トークンを更新」）` });
  }
  const updated = toDate(rec.updated_at);
  if (!expired && updated && now.getTime() - updated.getTime() >= 8 * DAY) {
    alerts.push({ red: false, text: "トークンの自動更新が止まっているようです。「設定」→「トークンを更新」を押し、GitHubの Actions の「4. トークン」を確かめてください" });
  }
  const ghExp = toDate(rec.gh_key_expires_at);
  if (ghExp) {
    const n = daysLeft(ghExp, now);
    if (n <= 30) alerts.push({ red: false, text: `GitHubの鍵の期限が近づいています（あと${n}日）。手作業のパートH-2〜H-3で作り直してください` });
  }
  return alerts;
}

function renderTokenBanner() {
  const banner = $("token-banner");
  if (!state.conn || !state.tokenLoaded) { banner.hidden = true; return; }
  const alerts = tokenAlerts(state.token, new Date());
  if (!alerts.length) { banner.hidden = true; banner.replaceChildren(); return; }
  banner.className = "banner " + (alerts.some((a) => a.red) ? "danger" : "warn");
  banner.replaceChildren(...alerts.map((a) => h("p", { text: a.text })));
  banner.hidden = false;
}

function renderToken() {
  const status = $("token-status"), note = $("token-refresh-note"), btn = $("token-refresh");
  if (!state.conn || !state.tokenLoaded) {
    status.textContent = "—";
    btn.disabled = true;
    note.textContent = "";
    return;
  }
  const rec = state.token, now = new Date();
  if (!rec) {
    status.textContent = "未セットアップ";
    btn.disabled = true;
    note.textContent = "初回セットアップが終わると、押せるようになります。";
    return;
  }
  const lines = [];
  const exp = toDate(rec.expires_at);
  const expired = !!exp && exp.getTime() <= now.getTime();
  if (exp && !expired) lines.push(`期限：${fmtYMD(exp)}（あと${daysLeft(exp, now)}日）。毎週月曜の朝に自動で延びます。`);
  else if (exp) lines.push(`期限：${fmtYMD(exp)}（期限切れ）`);
  else lines.push("期限：—");
  const ghExp = toDate(rec.gh_key_expires_at);
  if (ghExp) lines.push(`GitHubの鍵（GH_SECRETS_TOKEN）の期限：${fmtYMD(ghExp)}（あと${daysLeft(ghExp, now)}日）`);
  status.textContent = lines.join("\n");

  const updated = toDate(rec.updated_at);
  const openAt = updated ? new Date(updated.getTime() + DAY) : null;
  if (expired) {
    btn.disabled = true;
    note.textContent = "期限が切れているので、押せません（取り直しが必要です）。";
  } else if (openAt && now.getTime() < openAt.getTime()) {
    btn.disabled = true;
    note.textContent = `前回の発行・更新から24時間たっていないので、まだ押せません。${fmtFull(openAt)} から押せます。`;
  } else {
    btn.disabled = false;
    note.textContent = "";
  }
}

// ----- 設定フォーム -----
function timeOptions() {
  const list = [];
  for (let hour = 7; hour <= 23; hour++) list.push(`${String(hour).padStart(2, "0")}:00`);
  return list;
}
function buildSettingsForm() {
  const ppd = $("set-posts-per-day");
  for (let i = 1; i <= 10; i++) ppd.append(h("option", { value: String(i), text: String(i) }));
  const box = $("times-box");
  const opts = timeOptions();
  for (let i = 1; i <= 10; i++) {
    const sel = h("select", { id: `set-time-${i}`, "aria-label": `投稿の時間 ${i}つ目` });
    opts.forEach((t) => sel.append(h("option", { value: t, text: t })));
    sel.value = DEFAULT_TIMES[i - 1];
    box.append(h("label", { "data-time-row": i }, `${i}つ目`, sel));
  }
}
function setTimeValue(sel, value) {
  if (![...sel.options].some((o) => o.value === value)) sel.append(h("option", { value, text: value }));
  sel.value = value;
}
function showTimeRows() {
  const n = parseInt($("set-posts-per-day").value, 10) || 1;
  for (let i = 1; i <= 10; i++) document.querySelector(`[data-time-row="${i}"]`).hidden = i > n;
}
function fillSettingsForm() {
  const s = state.settings;
  if (!s || state.formDirty) return;
  $("set-handle").value = s.handle;
  $("set-persona").value = s.persona || "";
  $("set-audience").value = s.audience || "";
  $("set-themes").value = s.themes.join("\n");
  $("set-posts-per-day").value = String(s.posts_per_day);
  // 保存ずみの時刻を使い、足りない欄には既定の並びから、ほかの欄で使っていない時刻を入れておく
  const saved = [...s.saved_times].sort(byTime);
  const times = fillTimes(saved, 10);
  for (let i = 1; i <= 10; i++) setTimeValue($(`set-time-${i}`), times[i - 1]);
  showTimeRows();
  $("set-max-per-day").value = String(s.max_posts_per_day);
  $("settings-errors").hidden = true;
}
function readSettingsForm() {
  const n = parseInt($("set-posts-per-day").value, 10) || 1;
  const times = [];
  for (let i = 1; i <= n; i++) times.push($(`set-time-${i}`).value);
  return {
    handle: $("set-handle").value.trim().replace(/^@+/, ""),
    persona: $("set-persona").value.trim(),
    audience: $("set-audience").value.trim(),
    themes: $("set-themes").value.split(/\r?\n/).map((t) => t.trim()).filter((t) => t),
    posts_per_day: n,
    post_times: times.sort(byTime),
    max_posts_per_day: Number($("set-max-per-day").value)
  };
}
function validateSettings(v) {
  const errors = [];
  if (!/^[A-Za-z0-9_.]{1,30}$/.test(v.handle)) errors.push("アカウント名は、英数字・_・. の30文字以内で入れてください");
  if (!v.themes.length) errors.push("発信テーマを1つ以上入れてください");
  const ok = v.post_times.every((t) => /^\d{2}:00$/.test(t) && toMinutes(t) >= 7 * 60 && toMinutes(t) <= 23 * 60);
  if (!ok) errors.push("投稿の時間は、07:00〜23:00 のちょうどの時刻にしてください");
  const mins = v.post_times.map(toMinutes).sort((a, b) => a - b);
  for (let i = 1; i < mins.length; i++) {
    if (mins[i] - mins[i - 1] < 60) { errors.push("投稿の時間は、1時間以上あけてください（同じ時刻を2つ選ばない）"); break; }
  }
  if (!Number.isInteger(v.max_posts_per_day) || v.max_posts_per_day < 1 || v.max_posts_per_day > 50) errors.push("1日の投稿の上限は、1〜50 の数字にしてください");
  else if (v.max_posts_per_day < v.posts_per_day) errors.push("1日の投稿の上限は、1日の投稿の数以上にしてください");
  return errors;
}

// ===== 操作 =====
const DONE = { approve: "承認しました", reject: "却下しました", cancel: "取り消しました", edit: "修正しました" };

async function sendControl(id, action, text) {
  state.pendingIds.add(id);
  renderHome();
  try {
    await runControl(action, id, text);
    toast(`${DONE[action]}。1分ほどで反映されます`);
  } catch (e) {
    state.pendingIds.delete(id);
    renderHome();
    toast(e.message, true);
  }
}

async function onCardAction(card, action) {
  const id = card.getAttribute("data-id");
  const item = state.queue.find((q) => q.id === id);
  if (!item) return;
  if (action === "approve" || action === "reject" || action === "cancel") {
    await sendControl(id, action);
  } else if (action === "edit") {
    state.editing.set(id, [...(item.parts || [""])]);
    renderHome();
    const ta = document.querySelector(`.post-card[data-id="${CSS.escape(id)}"] textarea.edit-part`);
    if (ta) ta.focus();
  } else if (action === "add-part") {
    state.editing.get(id).push("");
    renderHome();
    const all = document.querySelectorAll(`.post-card[data-id="${CSS.escape(id)}"] textarea.edit-part`);
    if (all.length) all[all.length - 1].focus();
  } else if (action === "cancel-edit") {
    state.editing.delete(id);
    renderHome();
  } else if (action === "save-edit") {
    const parts = splitParts(state.editing.get(id).join("\n---\n"));
    if (checkParts(parts, state.settings).length) return;
    state.editing.delete(id);
    await sendControl(id, "edit", parts.join("\n---\n"));
  }
}

async function setMode(mode) {
  if (!needConn() || state.settings.mode === mode) return;
  if (mode === "auto" && !(await ask("完全自動にしますか？\nAIが作った下書きが、承認なしで投稿されるようになります。"))) return;
  try { await updateSettings((s) => { s.mode = mode; }); toast("設定を保存しました"); }
  catch (e) { toast(e.message, true); }
}
async function setPaused(paused) {
  if (!needConn()) return;
  if (paused && !(await ask("緊急停止しますか？\n下書きづくりも投稿も止まります。"))) return;
  try { await updateSettings((s) => { s.paused = paused; }); toast("設定を保存しました"); }
  catch (e) { toast(e.message, true); }
}

// 「これから使うネタ」を1件削除する（番号は上から何番目か、本文は表示しているネタ）
async function deleteNeta(btn) {
  if (!needConn()) return;
  const number = Number(btn.getAttribute("data-index"));
  const text = state.neta.unused[number - 1];
  if (!text || !window.confirm("このネタを削除しますか？")) return;
  btn.disabled = true;
  try {
    await runControl("neta-delete", String(number), text);
    toast("削除しました。1分ほどでネタ帳から消えます");
  } catch (e) {
    btn.disabled = false;
    toast(e.message, true);
  }
}

async function onConnect() {
  const conn = {
    owner: $("conn-owner").value.trim(),
    repo: $("conn-repo").value.trim(),
    token: $("conn-token").value.trim()
  };
  if (!conn.owner || !conn.repo || !conn.token) {
    setConnStatus("GitHub のユーザー名・リポジトリ名・アクセストークンを、すべて入れてください", "bad");
    return;
  }
  $("conn-save").disabled = true;
  setConnStatus("確かめています…", "");
  try {
    await readFile("settings.json", conn); // まず settings.json を読めるか確かめる
    state.conn = conn;
    state.repoInfo = null;
    state.formDirty = false;
    saveConn(conn);
    await loadAll();
    setConnStatus("接続しました", "good");
    toast("接続しました");
  } catch (e) {
    setConnStatus(`接続できませんでした：${e.message}`, "bad");
  } finally {
    $("conn-save").disabled = false;
  }
}

function onDisconnect() {
  clearConn();
  reloadTimers.forEach(clearTimeout);
  Object.assign(state, {
    conn: null, repoInfo: null, settings: null, queue: [], history: [], neta: { unused: [], used: [] },
    token: null, tokenLoaded: false, runs: [], formDirty: false
  });
  state.pendingIds.clear();
  state.editing.clear();
  $("conn-owner").value = "";
  $("conn-repo").value = "";
  $("conn-token").value = "";
  setConnStatus("接続を解除しました（この端末から消しました）", "");
  renderAll();
}

function bind() {
  for (const t of TABS) $(`tab-btn-${t}`).addEventListener("click", () => switchTab(t));

  document.addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-action]");
    if (!btn || btn.disabled) return;
    const action = btn.getAttribute("data-action");
    if (action === "reload") {
      if (needConn()) loadAll();
      return;
    }
    if (action === "resume") { setPaused(false); return; }
    if (action === "neta-delete") { deleteNeta(btn); return; }
    const card = btn.closest(".post-card");
    if (card) onCardAction(card, action);
  });
  for (const listId of ["pending-list", "scheduled-list"]) {
    $(listId).addEventListener("input", (ev) => {
      const ta = ev.target.closest("textarea.edit-part");
      const card = ev.target.closest(".post-card");
      if (!ta || !card) return;
      const parts = state.editing.get(card.getAttribute("data-id"));
      if (!parts) return;
      parts[Number(ta.getAttribute("data-index"))] = ta.value;
      updateEditValidity(card);
    });
  }

  $("mode-approval").addEventListener("click", () => setMode("approval"));
  $("mode-auto").addEventListener("click", () => setMode("auto"));
  $("pause-btn").addEventListener("click", () => { if (needConn()) setPaused(!state.settings.paused); });
  $("plan-now").addEventListener("click", async () => {
    if (!needConn()) return;
    const btn = $("plan-now");
    btn.disabled = true;
    try { await dispatch("plan.yml"); toast("下書きの作成を始めました。1〜2分で届きます"); }
    catch (e) { toast(e.message, true); }
    finally { btn.disabled = false; }
  });

  $("neta-submit").addEventListener("click", async () => {
    if (!needConn()) return;
    const text = $("neta-input").value.trim();
    if (!text) { toast("ネタを入れてください", true); return; }
    const btn = $("neta-submit");
    btn.disabled = true;
    try {
      await runControl("neta-add", "", text);
      $("neta-input").value = "";
      toast("ネタを追加しました。1分ほどでネタ帳に入ります");
    } catch (e) {
      toast(e.message, true);
    } finally {
      btn.disabled = false;
    }
  });

  $("token-refresh").addEventListener("click", async () => {
    if (!needConn()) return;
    const btn = $("token-refresh");
    btn.disabled = true;
    try { await dispatch("token.yml", { action: "refresh" }); toast("トークンの更新を始めました。1〜2分で期限が延びます"); }
    catch (e) { toast(e.message, true); renderToken(); }
  });
  $("token-setup").addEventListener("click", async () => {
    if (!needConn()) return;
    if (!(await ask("Secrets に入れた Threads のトークンを確かめて、期限を記録します。始めますか？"))) return;
    try { await dispatch("token.yml", { action: "setup" }); toast("初回セットアップを始めました。1〜2分で期限が表示されます"); }
    catch (e) { toast(e.message, true); }
  });

  const form = ["set-handle", "set-persona", "set-audience", "set-themes", "set-posts-per-day", "set-max-per-day"];
  for (let i = 1; i <= 10; i++) form.push(`set-time-${i}`);
  form.forEach((id) => $(id).addEventListener("input", () => { state.formDirty = true; }));
  $("set-posts-per-day").addEventListener("change", () => { state.formDirty = true; showTimeRows(); });
  $("settings-save").addEventListener("click", async () => {
    if (!needConn()) return;
    const v = readSettingsForm();
    const errors = validateSettings(v);
    const box = $("settings-errors");
    if (errors.length) {
      box.replaceChildren(h("ul", null, errors.map((e) => h("li", { text: e }))));
      box.hidden = false;
      box.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    box.hidden = true;
    const btn = $("settings-save");
    btn.disabled = true;
    try {
      await updateSettings((s) => Object.assign(s, v));
      state.formDirty = false;
      fillSettingsForm();
      toast("設定を保存しました");
    } catch (e) {
      box.replaceChildren(h("ul", null, h("li", { text: e.message })));
      box.hidden = false;
    } finally {
      btn.disabled = false;
    }
  });

  $("conn-save").addEventListener("click", onConnect);
  $("conn-clear").addEventListener("click", onDisconnect);
  $("confirm-yes").addEventListener("click", () => closeAsk(true));
  $("confirm-no").addEventListener("click", () => closeAsk(false));
  $("confirm-back").addEventListener("click", (ev) => { if (ev.target === $("confirm-back")) closeAsk(false); });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !$("confirm-back").hidden) closeAsk(false); });

  // 画面に戻ってきたら読み直す
  document.addEventListener("visibilitychange", () => { if (!document.hidden && state.conn) loadAll(); });
}

function init() {
  buildSettingsForm();
  bind();
  state.conn = loadConn();
  let tab = "home";
  try { tab = localStorage.getItem(LS_TAB) || "home"; } catch (e) { /* 何もしない */ }
  if (state.conn) {
    $("conn-owner").value = state.conn.owner;
    $("conn-repo").value = state.conn.repo;
    $("conn-token").value = state.conn.token;
    switchTab(tab);
    renderAll();
    loadAll();
  } else {
    switchTab("settings");
    renderAll();
    toast(NOT_CONNECTED);
  }
}

init();
</script>
